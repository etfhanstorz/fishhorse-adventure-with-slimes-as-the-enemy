<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slime Forge</title>
<style>
  :root { --bg:#1b2233; --panel:#262f45; --panel2:#2f3a56; --edge:#46557a; --fg:#eef2ff;
          --dim:#9aa6c7; --gold:#ffd166; --hp:#ef476f; --xp:#06d6a0; --accent:#4cc9f0; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family: "Segoe UI", system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:10px 14px; background:var(--panel); border-bottom:3px solid var(--edge); }
  header h1 { margin:0; font-size:20px; color:var(--xp); letter-spacing:1px; }
  .stat { font-weight:600; padding:4px 10px; border-radius:999px; background:var(--panel2); }
  .stat.hp { color:var(--hp); } .stat.xp { color:var(--xp); } .stat.gold { color:var(--gold); }
  #mode { margin-left:auto; font-size:12px; color:var(--dim); }
  main { display:grid; grid-template-columns: minmax(0,1fr) 340px; gap:12px; padding:12px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card { background:var(--panel); border:3px solid var(--edge); border-radius:10px; padding:10px; }
  #stage { position:relative; }
  canvas#game { width:100%; height:auto; display:block; border-radius:6px; image-rendering: pixelated; background:#000; }
  .hint { font-size:12px; color:var(--dim); margin-top:6px; }
  .pad { display:grid; grid-template-columns: repeat(3, 52px); gap:6px; justify-content:center; margin-top:10px; }
  .pad button { height:48px; }
  .btn { background:var(--panel2); color:var(--fg); border:2px solid var(--edge); border-radius:8px; padding:8px 10px; font:inherit; font-weight:600; cursor:pointer; }
  .btn:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn.good { background:#1f6f5c; border-color:#06d6a0; }
  .btn.bad { background:#6b2b3d; border-color:var(--hp); }
  .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .tabs { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:8px; }
  .tabs .btn.on { background:var(--accent); color:#0b1020; border-color:var(--accent); }
  .panel-body { max-height:52vh; overflow-y:auto; font-size:14px; }
  .item { background:var(--panel2); border-radius:8px; padding:8px; margin-bottom:6px; }
  .item b { color:var(--gold); }
  .muted { color:var(--dim); font-size:12px; }
  .pill { display:inline-block; font-size:11px; padding:2px 6px; border-radius:6px; background:#0b1020; color:var(--accent); margin-right:4px; }
  #log { margin:0; height:150px; overflow-y:auto; font-family: Consolas, monospace; font-size:13px; line-height:1.4; white-space:pre-wrap; background:#0b1020; border-radius:8px; padding:8px; }
  #log .me { color:var(--accent); } #log .warn { color:var(--gold); } #log .bad { color:var(--hp); }
  .kbd { font-family:Consolas,monospace; background:#0b1020; border-radius:4px; padding:1px 5px; }
</style>
</head>
<body>
<header>
  <h1>SLIME FORGE</h1>
  <span class="stat hp" id="s-hp">HP --</span>
  <span class="stat" id="s-lv">Lv --</span>
  <span class="stat xp" id="s-xp">XP --</span>
  <span class="stat gold" id="s-gold">Gold --</span>
  <span class="stat" id="s-pot">Potions --</span>
  <span id="mode">connecting...</span>
</header>

<main>
  <section>
    <div class="card" id="stage">
      <canvas id="game" width="768" height="432"></canvas>
      <div class="hint">Move: <span class="kbd">WASD</span>/arrows &nbsp; Mine: <span class="kbd">E</span> &nbsp; Battle: <span class="kbd">1</span> attack <span class="kbd">2</span> special <span class="kbd">3</span> potion <span class="kbd">4</span> flee &nbsp; Panels: <span class="kbd">I</span> inventory, <span class="kbd">F</span> forge, <span class="kbd">Q</span> quests, <span class="kbd">K</span> skills</div>
      <div class="pad" id="pad">
        <span></span><button class="btn" data-cmd="n">N</button><span></span>
        <button class="btn" data-cmd="w">W</button><button class="btn" data-cmd="mine">Mine</button><button class="btn" data-cmd="e">E</button>
        <span></span><button class="btn" data-cmd="s">S</button><span></span>
      </div>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="muted">Adventure log</div>
      <pre id="log"></pre>
    </div>
  </section>

  <aside class="card">
    <div class="tabs" id="tabs"></div>
    <div class="panel-body" id="panel"></div>
  </aside>
</main>

<script src="app.js"></script>
</body>
</html>
